[package]
name = "mcpg-plugin-identity-jwt"
version = "0.1.0-alpha.19"
license = "Apache-2.0"
edition = "2024"
description = "Generic static-key JWT identity_provider plugin for MCPG (dev.mcpg.identity.jwt) — verifies non-OIDC bearer JWTs against operator-supplied static keys (HS/RS/ES/EdDSA / static JWKS); no discovery, no network."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16", features = ["static-firstparty"] }
# Pure-Rust JWT on aws-lc-rs (rustls-clean crypto backend, NO openssl); use_pem
# enables from_rsa_pem/from_ec_pem/from_ed_pem. EXACT pin from identity/workload
# — adds no new lock entry.
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs", "use_pem"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
metrics = "0.24"
tracing = "0.1"

[features]
default = []
cdylib-export = []
static-firstparty = []
